general {
    hide_cursor = true
}

background {
    path = screenshot
    blur_passes = 3
    blur_size = 8
    color = rgba(0,0,0,0.3)
}

input-field {
    size = 250, 60
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.35
    dots_center = true
    outer_color = rgba(0,0,0,0)
    inner_color = rgba(0,0,0,0.3)
    font_color = rgb(200,200,200)
    fade_on_empty = false
    hide_input = false
    position = 0, -200
    halign = center
    valign = center
}

label {
    text = cmd[update:1000] echo "$(date +'%A, %B %d')"
    color = rgba(255,255,255,0.75)
    font_size = 22
    font_family = DejaVu Sans Mono
    position = 0, 290
    halign = center
    valign = center
}

label {
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    color = rgba(255,255,255,0.75)
    font_size = 95
    font_family = DejaVu Sans Mono
    position = 0, 180
    halign = center
    valign = center
}
