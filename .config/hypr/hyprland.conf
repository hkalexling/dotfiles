$mainMod = ALT

input {
    kb_options = ctrl:nocaps
    touchpad {
      natural_scroll = yes
    }
}

general {
  layout = scrolling
}

scrolling {
  column_width = 0.5
  direction = right
}

xwayland {
  force_zero_scaling = true
  use_nearest_neighbor = true
}

gesture = 3, horizontal, scrollMove

monitor = , preferred, auto, 1.25

env = HYPRCURSOR_THEME, rose-pine-hyprcursor
env = HYPRCURSOR_SIZE, 30

animations {
    enabled = yes
    bezier = snappy, 0.15, 0.75, 0.0, 1.0

    animation = windows, 1, 3, snappy, popin
    animation = windowsOut, 1, 3, snappy, popin
    animation = windowsMove, 1, 3, snappy, slide
    animation = workspaces, 1, 2, snappy, slide
    animation = border, 1, 3, snappy
    animation = fade, 1, 3, snappy
    animation = layers, 1, 3, snappy
}

exec-once = /usr/lib/hyprpolkitagent/hyprpolkitagent
exec-once = waybar
exec-once = hyprpaper
exec-once = nm-applet
exec-once = fcitx5
exec-once = hypridle
exec-once = swayosd-server
exec-once = conky -c ~/.config/hypr/conky

bind = $mainMod CONTROL, L, exec, hyprlock

binde = , XF86AudioRaiseVolume, exec, swayosd-client --output-volume raise
binde = , XF86AudioLowerVolume, exec, swayosd-client --output-volume lower
bind = , XF86AudioMute, exec, swayosd-client --output-volume mute-toggle
binde = , XF86MonBrightnessUp, exec, swayosd-client --brightness raise
binde = , XF86MonBrightnessDown, exec, swayosd-client --brightness lower

bind = $mainMod, RETURN, exec, kitty
bind = $mainMod CONTROL, RETURN, execr, BROWSER=/usr/bin/chromium chromium
bind = $mainMod SHIFT, R, exec, hyprctl reload
bind = $mainMod, Q, killactive,
bind = $mainMod, SPACE, togglefloating,
bind = $mainMod SHIFT, SPACE, pin,
bind = , Print, exec, ~/.config/hypr/scripts/screenshot.sh
bind = SHIFT, Print, exec, ~/.config/hypr/scripts/screenshot-annotate.sh
bind = CTRL, Print, exec, ~/.config/hypr/scripts/record-toggle.sh
bind = $mainMod, D, exec, ~/.config/hypr/scripts/rofi.sh
bind = $mainMod, 0, exec, ~/.config/hypr/scripts/system.sh
bind = $mainMod, U, exec, ~/.config/hypr/scripts/util.sh

bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, grave, workspace, 10

bind = $mainMod SHIFT, 1, movetoworkspacesilent, 1
bind = $mainMod SHIFT, 2, movetoworkspacesilent, 2
bind = $mainMod SHIFT, 3, movetoworkspacesilent, 3
bind = $mainMod SHIFT, 4, movetoworkspacesilent, 4
bind = $mainMod SHIFT, 5, movetoworkspacesilent, 5
bind = $mainMod SHIFT, 6, movetoworkspacesilent, 6
bind = $mainMod SHIFT, 7, movetoworkspacesilent, 7
bind = $mainMod SHIFT, 8, movetoworkspacesilent, 8
bind = $mainMod SHIFT, 9, movetoworkspacesilent, 9
bind = $mainMod SHIFT, grave, movetoworkspacesilent, 10

bind = $mainMod, F1, workspace, 11
bind = $mainMod, F2, workspace, 12
bind = $mainMod, F3, workspace, 13
bind = $mainMod, F4, workspace, 14
bind = $mainMod, F5, workspace, 15
bind = $mainMod, F6, workspace, 16
bind = $mainMod, F7, workspace, 17
bind = $mainMod, F8, workspace, 18
bind = $mainMod, F9, workspace, 19
bind = $mainMod, F10, workspace, 20
bind = $mainMod, F11, workspace, 21
bind = $mainMod, F12, workspace, 22

bind = $mainMod SHIFT, F1, movetoworkspacesilent, 11
bind = $mainMod SHIFT, F2, movetoworkspacesilent, 12
bind = $mainMod SHIFT, F3, movetoworkspacesilent, 13
bind = $mainMod SHIFT, F4, movetoworkspacesilent, 14
bind = $mainMod SHIFT, F5, movetoworkspacesilent, 15
bind = $mainMod SHIFT, F6, movetoworkspacesilent, 16
bind = $mainMod SHIFT, F7, movetoworkspacesilent, 17
bind = $mainMod SHIFT, F8, movetoworkspacesilent, 18
bind = $mainMod SHIFT, F9, movetoworkspacesilent, 19
bind = $mainMod SHIFT, F10, movetoworkspacesilent, 20
bind = $mainMod SHIFT, F11, movetoworkspacesilent, 21
bind = $mainMod SHIFT, F12, movetoworkspacesilent, 22

bind = $mainMod, H, movefocus, l
bind = $mainMod, J, movefocus, d
bind = $mainMod, K, movefocus, u
bind = $mainMod, L, movefocus, r

bind = $mainMod SHIFT, J, movewindow, d
bind = $mainMod SHIFT, K, movewindow, u
# bind = $mainMod SHIFT, H, movewindow, l
# bind = $mainMod SHIFT, L, movewindow, r
bind = $mainMod SHIFT, H, layoutmsg, swapcol l
bind = $mainMod SHIFT, L, layoutmsg, swapcol r

bind = $mainMod SHIFT, comma, movecurrentworkspacetomonitor, l
bind = $mainMod SHIFT, period, movecurrentworkspacetomonitor, r
