$mainMod = ALT
$terminal = kitty
$fileManager = dolphin
$menu = rofi -show run

bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

input {
    kb_options = ctrl:nocaps
    touchpad {
      natural_scroll = yes
    }
}

animations {
    enabled = yes
    bezier = snappy, 0.15, 0.75, 0.0, 1.0

    animation = windows, 1, 3, snappy, popin
    animation = windowsOut, 1, 3, snappy, popin
    animation = windowsMove, 1, 3, snappy, slide
    animation = workspaces, 1, 2, snappy, slide
    animation = border, 1, 3, snappy
    animation = fade, 1, 3, snappy
    animation = layers, 1, 3, snappy
}

exec-once = /usr/lib/hyprpolkitagent/hyprpolkitagent
exec-once = waybar
exec-once = hyprpaper
exec-once = nm-applet
exec-once = fcitx5
exec-once = hypridle
exec-once = conky -c ~/.config/hypr/conky

bind = $mainMod CONTROL, L, exec, hyprlock

binde = , XF86AudioRaiseVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ +5%
binde = , XF86AudioLowerVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ -5%
bind = , XF86AudioMute, exec, pactl set-sink-mute @DEFAULT_SINK@ toggle
binde = , XF86MonBrightnessUp, exec, brightnessctl set +5%
binde = , XF86MonBrightnessDown, exec, brightnessctl set 5%-
bind = , Print, exec, ~/.config/hypr/scripts/screenshot.sh
bind = CTRL, Print, exec, ~/.config/hypr/scripts/record-toggle.sh

bind = $mainMod, RETURN, exec, $terminal
bind = $mainMod CONTROL, RETURN, execr, BROWSER=/usr/bin/chromium chromium
bind = $mainMod, F, exec, $fileManager
bind = $mainMod SHIFT, R, exec, hyprctl reload
bind = $mainMod, Q, killactive,
bind = $mainMod, SPACE, togglefloating,
bind = $mainMod, D, exec, $menu
bind = $mainMod, 0, exec, ~/.config/hypr/scripts/system.sh
bind = $mainMod, U, exec, ~/.config/hypr/scripts/util.sh

# Workspace switching
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9

# Move window to workspace
bind = $mainMod SHIFT, 1, movetoworkspacesilent, 1
bind = $mainMod SHIFT, 2, movetoworkspacesilent, 2
bind = $mainMod SHIFT, 3, movetoworkspacesilent, 3
bind = $mainMod SHIFT, 4, movetoworkspacesilent, 4
bind = $mainMod SHIFT, 5, movetoworkspacesilent, 5
bind = $mainMod SHIFT, 6, movetoworkspacesilent, 6
bind = $mainMod SHIFT, 7, movetoworkspacesilent, 7
bind = $mainMod SHIFT, 8, movetoworkspacesilent, 8
bind = $mainMod SHIFT, 9, movetoworkspacesilent, 9

# Focus movement
bind = $mainMod, H, movefocus, l
bind = $mainMod, J, movefocus, d
bind = $mainMod, K, movefocus, u
bind = $mainMod, L, movefocus, r

# Move windows
bind = $mainMod SHIFT, H, movewindow, l
bind = $mainMod SHIFT, J, movewindow, d
bind = $mainMod SHIFT, K, movewindow, u
bind = $mainMod SHIFT, L, movewindow, r

# Move workspace between monitors
bind = $mainMod SHIFT, comma, movecurrentworkspacetomonitor, l
bind = $mainMod SHIFT, period, movecurrentworkspacetomonitor, r

# Resize submode
bind = $mainMod, R, submap, resize
submap = resize
bind = , H, resizeactive, -30 0
bind = , J, resizeactive, 0 30
bind = , K, resizeactive, 0 -30
bind = , L, resizeactive, 30 0
bind = , escape, submap, reset
submap = reset
